# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# Previously this project included package:very_good_analysis, which targets
# published packages and flagged 600+ style-only issues on this app (plus
# strict-casts / strict-inference, which turned legal `dynamic` assignments
# into hard errors). Switched to the official Flutter lint set — which is also
# already declared in dev_dependencies.
#
# To go back to the stricter set, replace the include below with:
#   include: package:very_good_analysis/analysis_options.yaml
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # Additional rules for this project
    prefer_single_quotes: true
    avoid_print: true
    avoid_unnecessary_containers: true
    prefer_const_constructors: true
    prefer_const_literals_to_create_immutables: true
    prefer_final_fields: true
    prefer_final_locals: true
    sort_child_properties_last: true
    use_key_in_widget_constructors: true

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.mocks.dart"
  errors:
    invalid_annotation_target: ignore

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
