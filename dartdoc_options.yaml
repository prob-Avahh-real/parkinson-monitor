dartdoc:
  # Documentation configuration
  linkToSource:
    root: '.'
    uriTemplate: 'https://github.com/YOUR_ORG/parkinson-monitor/blob/main/%f%#L%l%'
  
  # Categories
  categories:
    Core:
      displayName: Core
      markdown: lib/core/README.md
    Domain:
      displayName: Domain
      markdown: lib/domain/README.md
    Data:
      displayName: Data
      markdown: lib/data/README.md
    Services:
      displayName: Services
      markdown: lib/services/README.md
    Presentation:
      displayName: Presentation
      markdown: lib/presentation/README.md
  
  # Exclude from documentation
  exclude:
    - '**/*.g.dart'
    - '**/*.freezed.dart'
    - '**/*.mocks.dart'
    - '**/main.dart'
  
  # Include private members
  includePrivate: false
  
  # Show code examples
  showUndocumentedMembers: false
  
  # Use category headers
  useCategoryHeaders: true
