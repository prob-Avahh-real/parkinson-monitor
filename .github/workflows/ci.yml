name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
          cache: true
      - run: flutter pub get
      # pubspec.yaml declares .env as an asset, so the asset bundle needs the
      # file to exist even for analysis.
      - name: Prepare .env file
        run: cp .env.ci .env
      # Style/info lints are reported for guidance but are not fatal;
      # errors and warnings still fail the job.
      - run: flutter analyze --no-fatal-infos

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
          cache: true
      - run: flutter pub get
      # pubspec.yaml declares .env as an asset, so the asset bundle needs it.
      - name: Prepare .env file
        run: cp .env.ci .env
      # test/screenshots/ holds pixel-comparison golden tests. Their reference
      # PNGs must be regenerated after any UI change and are host-rendering
      # sensitive, so they are excluded here. Regenerate locally with:
      #   flutter test --update-goldens test/screenshots
      - name: Run unit and widget tests
        run: >
          flutter test
          test/core
          test/data
          test/domain
          test/presentation
          test/services
          test/widget_test.dart
