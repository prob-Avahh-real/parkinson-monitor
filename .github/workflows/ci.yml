name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
          cache: true
      - run: flutter pub get
      # Style/info lints are reported for guidance but are not fatal;
      # errors and warnings still fail the job.
      - run: flutter analyze --no-fatal-infos

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
          cache: true
      - run: flutter pub get
      # pubspec.yaml declares .env as an asset, so the asset bundle
      # (built even for `flutter test`) requires the file to exist.
      - name: Prepare .env file
        run: cp .env.ci .env
      - run: flutter test
