name: iOS Build

# Builds an unsigned iOS artifact on a GitHub-hosted macOS runner.
# No local Xcode, disk space, or Apple Developer account required.
#
#  1. tries a device (iphoneos) build with code signing disabled -> unsigned .ipa
#  2. falls back to a simulator build -> Runner.app (signing never required)
#
# NOTE: an unsigned .ipa cannot be installed on a device as-is; it must be
# re-signed (e.g. Sideloadly with a free Apple ID) or built with signing
# secrets for device / App Store distribution.

on:
  push:
    branches: [ci/ios-cloud-build, main]
  workflow_dispatch:

jobs:
  ios:
    name: Build iOS unsigned
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          xcodebuild -version
          pod --version

      - name: Prepare CI env file
        run: cp .env.ci .env

      - name: Install dependencies
        run: flutter pub get

      - name: Disable Xcode code signing for CI
        run: |
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("ios/Runner.xcodeproj/project.pbxproj")
          s = p.read_text()
          b = s
          s = s.replace(
              "CODE_SIGN_STYLE = Automatic;",
              "CODE_SIGN_STYLE = Manual;\n\t\t\t\tCODE_SIGNING_ALLOWED = NO;\n\t\t\t\tCODE_SIGNING_REQUIRED = NO;",
          )
          s = s.replace(
              '"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "iPhone Developer";',
              '"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "";',
          )
          p.write_text(s)
          print("patched" if s != b else "NO CHANGE")
          PY
          grep -c "CODE_SIGNING_ALLOWED = NO" ios/Runner.xcodeproj/project.pbxproj

      - name: Build iOS release without codesign
        run: |
          set +e
          flutter build ios --release --no-codesign
          rc=$?
          echo "flutter build ios exit code: $rc"
          if [ -d build/ios/iphoneos/Runner.app ]; then
            echo "Runner.app produced -> usable"
          else
            echo "no device app produced -> simulator fallback will handle it"
          fi
          exit 0

      - name: Simulator fallback
        run: |
          if [ -d build/ios/iphoneos/Runner.app ]; then
            echo "Device build present; skipping simulator fallback."
          else
            echo "Building for simulator (never needs signing)..."
            flutter build ios --simulator --release
          fi

      - name: Package artifacts
        run: |
          set -e
          rm -rf dist Payload
          mkdir -p dist
          if [ -d build/ios/iphoneos/Runner.app ]; then
            echo "Packaging unsigned device IPA"
            mkdir -p Payload
            cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
            zip -qry dist/parkinson-monitor-unsigned.ipa Payload
          fi
          if [ -d build/ios/iphonesimulator/Runner.app ]; then
            echo "Packaging simulator app"
            ( cd build/ios/iphonesimulator && zip -qry "$GITHUB_WORKSPACE/dist/parkinson-monitor-simulator.zip" Runner.app )
          fi
          ls -lh dist/
          if [ -z "$(ls -A dist)" ]; then
            echo "no iOS artifacts were produced"
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: parkinson-monitor-ios
          path: dist/*
          if-no-files-found: error
          retention-days: 30
